name: build

on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: "Выпустить стабильную версию из version.txt: создаёт тег vX.Y.Z и релиз"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  linux:
    # Ядро без интерфейса: правила закрытия, сессия, настройки.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Тесты ядра
        run: dotnet test tests/GigaRest.Core.Tests -c Release --logger "console;verbosity=normal"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Тесты ядра
        run: dotnet test tests/GigaRest.Core.Tests -c Release
      - name: Windows-тесты (настоящие окна и процессы)
        # Подопытная программа TestDummy: закрывается вежливо, спрашивает «Сохранить?», прячется в трей.
        shell: pwsh
        run: |
          dotnet publish tools-src/TestDummy -c Release -o out/TestDummy
          if ($LASTEXITCODE -ne 0) { throw "TestDummy: код $LASTEXITCODE" }
          $env:GIGAREST_TESTDUMMY = "$PWD\out\TestDummy"
          dotnet test tests/GigaRest.Windows.Tests -c Release --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "Windows-тесты: код $LASTEXITCODE" }
      - name: Версия и канал
        # Решение D-RELEASE. Тег vX.Y.Z (или ручной запуск «release») → стабильная X.Y.Z, обычный релиз vX.Y.Z.
        # Остальное → тестовая X.Y.Z-dev.<run> из version.txt, выпуск dev-build.
        # Номер сборки (третья часть AssemblyVersion) — всегда номер запуска CI: по нему программа сравнивает сборки.
        shell: pwsh
        env:
          GR_RELEASE_INPUT: ${{ inputs.release }}
        run: |
          $base = (Get-Content version.txt -Raw).Trim()
          if ($base -notmatch '^\d+\.\d+\.\d+$') { throw "version.txt должен быть вида 1.2.3, а там: '$base'" }
          $run = [int]$env:GITHUB_RUN_NUMBER
          $stable = $false
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') {
              $version = $Matches[1]
              $stable = $true
              if ($version -ne $base) { Write-Warning "Тег $env:GITHUB_REF_NAME, а в version.txt $base — беру версию из тега." }
            } else {
              Write-Warning "Тег $env:GITHUB_REF_NAME не вида vX.Y.Z — собираю как тестовую сборку, без релиза"
            }
          }
          if ($env:GR_RELEASE_INPUT -eq 'true') { $version = $base; $stable = $true }
          if (-not $stable) { $version = "$base-dev.$run" }
          $core = $version.Split('-')[0].Split('.')
          "GR_VERSION=$version" >> $env:GITHUB_ENV
          "GR_FILE_VERSION=$($core[0]).$($core[1]).$run.0" >> $env:GITHUB_ENV
          "GR_STABLE=$($stable.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
          Write-Host "Версия $version, сборка $run, стабильная: $stable"
          "### GigaRest $version`nСборка $run, стабильная: $stable" >> $env:GITHUB_STEP_SUMMARY
      - name: Сборка программы
        shell: pwsh
        run: |
          dotnet publish src/GigaRest.App -c Release -r win-x64 -p:Platform=x64 `
            "-p:Version=$env:GR_VERSION" "-p:AssemblyVersion=$env:GR_FILE_VERSION" "-p:FileVersion=$env:GR_FILE_VERSION" `
            -p:DebugType=None -o out/GigaRest
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish: код $LASTEXITCODE" }
          if (-not (Test-Path out/GigaRest/GigaRest.exe)) { Get-ChildItem out/GigaRest; throw "Нет GigaRest.exe" }
          "{0,8:N1} MB  всего" -f ((Get-ChildItem out/GigaRest -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          Compress-Archive out/GigaRest GigaRest-win-x64.zip
      - name: Установщик (Inno Setup)
        # packaging/installer/GigaRest.iss → GigaRest-Setup.exe. Inno Setup есть не на каждом образе — ставим через choco.
        shell: pwsh
        run: |
          function Find-Iscc {
            $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe") | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            Write-Host "Inno Setup не найден — ставлю через choco"
            choco install innosetup -y --no-progress
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe не найден и после choco install innosetup" }
          $out = "$PWD\out\installer"
          & $iscc "/DAppVersion=$env:GR_VERSION" "/DFileVersion=$env:GR_FILE_VERSION" `
            "/DAppSource=$PWD\out\GigaRest" "/DOutputDir=$out" packaging\installer\GigaRest.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC: код $LASTEXITCODE" }
          Copy-Item "$out\GigaRest-Setup.exe" GigaRest-Setup.exe
          "{0,8:N1} MB  GigaRest-Setup.exe" -f ((Get-Item GigaRest-Setup.exe).Length / 1MB)
      - name: Установщик — проверка (тихая установка и удаление)
        shell: pwsh
        run: |
          $p = Start-Process .\GigaRest-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=','/LOG=setup.log' -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content setup.log -Tail 40; throw "Установка: код $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\GigaRest"
          if (-not (Test-Path "$app\GigaRest.exe")) { throw "После установки нет $app\GigaRest.exe" }
          $entry = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -eq 'GigaRest' }
          if (-not $entry) { throw "GigaRest нет в «Установленных приложениях»" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\GigaRest.lnk")) { throw "Нет ярлыка в меню «Пуск»" }
          $code = (Start-Process "$app\GigaRest.exe" -ArgumentList '--exit' -PassThru -Wait).ExitCode
          if ($code -ne 0) { throw "--exit без запущенной программы: код $code (ждали 0)" }
          $u = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$app\GigaRest.exe") { throw "После удаления осталась программа" }
          Write-Host "Установка и удаление — в порядке"
      - name: Скриншоты интерфейса
        # Программа рисует окно на демо-данных во всех состояниях и сама выходит.
        shell: pwsh
        run: |
          $shots = "$PWD\screenshots"
          New-Item -ItemType Directory $shots -Force | Out-Null
          $env:GIGAREST_DATA = "$env:RUNNER_TEMP\gigarest-data"
          $p = Start-Process out/GigaRest/GigaRest.exe -ArgumentList @('--screenshots', $shots) -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "Скриншоты: программа не завершилась за 3 минуты" }
          Get-ChildItem $shots
          if (Test-Path "$shots\error.txt") { Get-Content "$shots\error.txt"; throw "Скриншоты: ошибка" }
          if ($p.ExitCode -ne 0) { throw "Скриншоты: код $($p.ExitCode)" }
          if ((Get-ChildItem $shots -Filter *.png).Count -lt 22) { throw "Скриншотов меньше двадцати двух" }
      - name: Пробный режим — тестовое окно запускается
        # Копия GigaRest.exe под другим именем с --test-window должна показать окно с заголовком.
        shell: pwsh
        run: |
          Copy-Item out/GigaRest/GigaRest.exe "out/GigaRest/Тест 1 — закроется.exe"
          $p = Start-Process "out/GigaRest/Тест 1 — закроется.exe" -ArgumentList @('--test-window', '--mode', 'normal', '--title', '"Тест окно"') -PassThru
          $title = ""
          for ($i = 0; $i -lt 40 -and -not $title; $i++) { Start-Sleep -Milliseconds 250; $p.Refresh(); $title = $p.MainWindowTitle }
          Write-Host "Заголовок: '$title'"
          if ($title -ne "Тест окно") { if (-not $p.HasExited) { $p.Kill() }; throw "Тестовое окно не появилось" }
          if (-not $p.CloseMainWindow()) { throw "CloseMainWindow не сработал" }
          if (-not $p.WaitForExit(5000)) { $p.Kill(); throw "Тестовое окно не закрылось на крестик" }
          Remove-Item "out/GigaRest/Тест 1 — закроется.exe"
      - name: Самопроверка — настоящий переход в отдых на тестовых окнах
        # GigaRest.exe --selftest: тестовые окна → отдых → «Тихий» экран → снимок всего экрана → возврат.
        shell: pwsh
        run: |
          $data = "$env:RUNNER_TEMP\gigarest-selftest"
          $env:GIGAREST_DATA = $data
          $flag = "$data\rest-shown.flag"
          $p = Start-Process out/GigaRest/GigaRest.exe -ArgumentList '--selftest' -PassThru
          for ($i = 0; $i -lt 120 -and -not (Test-Path $flag) -and -not $p.HasExited; $i++) { Start-Sleep -Milliseconds 500 }
          Start-Sleep -Seconds 3
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory screenshots -Force | Out-Null
          $bmp.Save("$PWD\screenshots\13-samoproverka.png", [System.Drawing.Imaging.ImageFormat]::Png)
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Самопроверка не завершилась за 2 минуты" }
          Get-ChildItem "$data\logs" | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName }
          Copy-Item "$data\logs\*" screenshots -ErrorAction SilentlyContinue
          if (-not (Test-Path $flag)) { throw "Экраны отдыха не показались" }
          if ($p.ExitCode -ne 0) { throw "Самопроверка: код $($p.ExitCode)" }
      - name: Скриншоты — артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
      - name: Скриншоты в ветку screenshots
        # Картинки для README. Ветка без истории; каждая рабочая ветка — в своей папке.
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') && hashFiles('screenshots/*.png') != ''
        shell: pwsh
        run: |
          $branch = "$env:GITHUB_REF_NAME" -replace '[^A-Za-z0-9._-]', '-'
          $shots = "$env:GITHUB_WORKSPACE\screenshots"
          $ok = $false
          for ($attempt = 1; $attempt -le 6 -and -not $ok; $attempt++) {
            git fetch origin screenshots 2>$null
            $hasRemote = $LASTEXITCODE -eq 0
            $base = if ($hasRemote) { (git rev-parse FETCH_HEAD).Trim() } else { "" }
            $dir = "$env:RUNNER_TEMP\shots$attempt"
            git worktree add --detach $dir 2>$null
            Push-Location $dir
            git checkout --orphan "screenshots-tmp$attempt" --quiet
            git rm -rf . --quiet 2>$null
            if ($hasRemote) { git checkout $base -- . 2>$null }  # FETCH_HEAD у каждого worktree свой — берём по хэшу
            if (Test-Path $branch) { Remove-Item $branch -Recurse -Force }
            New-Item -ItemType Directory $branch -Force | Out-Null
            Copy-Item "$shots\*.png" $branch -Force
            git add -A
            git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -m "Скриншоты: $env:GITHUB_REF_NAME $env:GITHUB_SHA" --quiet
            if ($hasRemote) { git push "--force-with-lease=screenshots:$base" origin HEAD:screenshots }
            else { git push origin HEAD:screenshots }
            $ok = $LASTEXITCODE -eq 0
            Pop-Location
            if (-not $ok) { Start-Sleep -Seconds (Get-Random -Minimum 3 -Maximum 12) }
          }
          if (-not $ok) { Write-Warning "Скриншоты не опубликованы" }
          $global:LASTEXITCODE = 0
      - name: Выпуск — стабильный vX.Y.Z или тестовый dev-build (самообновление и постоянные ссылки)
        # Только если все проверки и самопроверка прошли (иначе сюда не дойдём). Программа читает version.json
        # и обновляется сама; Роман скачивает по одной ссылке:
        # https://github.com/Luchano55/gigarest/releases/download/dev-build/GigaRest-win-x64.zip
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $manifest = [ordered]@{
            build = [int]$env:GITHUB_RUN_NUMBER
            version = $env:GR_VERSION
            commit = $env:GITHUB_SHA
            zip = "GigaRest-win-x64.zip"
            sha256 = (Get-FileHash GigaRest-win-x64.zip -Algorithm SHA256).Hash
          }
          $manifest | ConvertTo-Json | Set-Content version.json -Encoding utf8NoBOM
          Get-Content version.json
          if ($env:GR_STABLE -eq 'true') {
            # Стабильный релиз vX.Y.Z: обычный (не prerelease), GitHub считает его последним —
            # постоянные ссылки releases/latest/download/… и стабильный канал обновлений ведут сюда.
            $tag = "v$env:GR_VERSION"
            ./build/release-notes.ps1 -Version $env:GR_VERSION -OutFile release-notes.md `
              -Footer ("SHA256 (GigaRest-Setup.exe): ``" + (Get-FileHash GigaRest-Setup.exe -Algorithm SHA256).Hash + "``")
            $files = @('GigaRest-Setup.exe', 'GigaRest-win-x64.zip', 'version.json')
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Релиз $tag уже есть — заменяю файлы и описание"
              gh release upload $tag @files --clobber
              if ($LASTEXITCODE -ne 0) { throw "gh release upload: код $LASTEXITCODE" }
              gh release edit $tag --title "GigaRest $env:GR_VERSION" --notes-file release-notes.md --prerelease=false --latest
            } else {
              gh release create $tag @files --target $env:GITHUB_SHA --title "GigaRest $env:GR_VERSION" --notes-file release-notes.md --latest
            }
            if ($LASTEXITCODE -ne 0) { throw "gh release: код $LASTEXITCODE" }
            "Релиз: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag" >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          # Тестовая сборка — в выпуск dev-build (из main и рабочих веток claude/*).
          if ($env:GITHUB_REF -ne 'refs/heads/main' -and -not $env:GITHUB_REF.StartsWith('refs/heads/claude/')) { Write-Host "Ветка $env:GITHUB_REF — без выпуска"; exit 0 }
          $notes = "Тестовая сборка GigaRest $env:GR_VERSION: всё новое сразу, могут быть ошибки. Проверенная версия — в последнем обычном релизе. " +
                   "Установить: GigaRest-Setup.exe (без прав администратора). Без установки: GigaRest-win-x64.zip — распакуйте в обычную папку и запустите GigaRest.exe. " +
                   "Дальше программа обновляется сама (значок в трее → «Проверить обновления»). Ветка $env:GITHUB_REF_NAME, коммит $env:GITHUB_SHA."
          # Выпуск не удаляем: иначе на полминуты ссылка на скачивание перестаёт работать.
          # Файлы заменяем по одному, version.json — последним (программа читает его первым).
          gh release view dev-build *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit dev-build --title "Тестовая сборка $env:GR_VERSION" --notes $notes --prerelease
            if ($LASTEXITCODE -ne 0) { throw "gh release edit dev-build: код $LASTEXITCODE" }
            foreach ($f in @('GigaRest-Setup.exe', 'GigaRest-win-x64.zip', 'version.json')) {
              gh release upload dev-build $f --clobber
              if ($LASTEXITCODE -ne 0) { throw "gh release upload $($f): код $LASTEXITCODE" }
            }
          } else {
            gh release create dev-build GigaRest-win-x64.zip GigaRest-Setup.exe version.json --prerelease --target $env:GITHUB_SHA `
              --title "Тестовая сборка $env:GR_VERSION" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create dev-build: код $LASTEXITCODE" }
          }
          "Скачать: https://github.com/$env:GITHUB_REPOSITORY/releases/download/dev-build/GigaRest-win-x64.zip" >> $env:GITHUB_STEP_SUMMARY
          "Установщик: https://github.com/$env:GITHUB_REPOSITORY/releases/download/dev-build/GigaRest-Setup.exe" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: GigaRest-win-x64
          path: out/GigaRest
          if-no-files-found: error
