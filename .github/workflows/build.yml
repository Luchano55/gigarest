name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # Ядро без интерфейса: правила закрытия, сессия, настройки.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Тесты ядра
        run: dotnet test tests/GigaRest.Core.Tests -c Release --logger "console;verbosity=normal"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Тесты ядра
        run: dotnet test tests/GigaRest.Core.Tests -c Release
      - name: Windows-тесты (настоящие окна и процессы)
        # Подопытная программа TestDummy: закрывается вежливо, спрашивает «Сохранить?», прячется в трей.
        shell: pwsh
        run: |
          dotnet publish tools-src/TestDummy -c Release -o out/TestDummy
          if ($LASTEXITCODE -ne 0) { throw "TestDummy: код $LASTEXITCODE" }
          $env:GIGAREST_TESTDUMMY = "$PWD\out\TestDummy"
          dotnet test tests/GigaRest.Windows.Tests -c Release --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "Windows-тесты: код $LASTEXITCODE" }
      - name: Версия
        shell: pwsh
        run: |
          $base = (Get-Content version.txt -Raw).Trim()
          $run = [int]$env:GITHUB_RUN_NUMBER
          $core = $base.Split('.')
          "GR_VERSION=$base-dev.$run" >> $env:GITHUB_ENV
          "GR_FILE_VERSION=$($core[0]).$($core[1]).$run.0" >> $env:GITHUB_ENV
      - name: Сборка программы
        shell: pwsh
        run: |
          dotnet publish src/GigaRest.App -c Release -r win-x64 -p:Platform=x64 `
            "-p:Version=$env:GR_VERSION" "-p:AssemblyVersion=$env:GR_FILE_VERSION" "-p:FileVersion=$env:GR_FILE_VERSION" `
            -p:DebugType=None -o out/GigaRest
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish: код $LASTEXITCODE" }
          if (-not (Test-Path out/GigaRest/GigaRest.exe)) { Get-ChildItem out/GigaRest; throw "Нет GigaRest.exe" }
          "{0,8:N1} MB  всего" -f ((Get-ChildItem out/GigaRest -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          Compress-Archive out/GigaRest GigaRest-win-x64.zip
      - name: Скриншоты интерфейса
        # Программа рисует окно на демо-данных во всех состояниях и сама выходит.
        shell: pwsh
        run: |
          $shots = "$PWD\screenshots"
          New-Item -ItemType Directory $shots -Force | Out-Null
          $env:GIGAREST_DATA = "$env:RUNNER_TEMP\gigarest-data"
          $p = Start-Process out/GigaRest/GigaRest.exe -ArgumentList @('--screenshots', $shots) -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "Скриншоты: программа не завершилась за 3 минуты" }
          Get-ChildItem $shots
          if (Test-Path "$shots\error.txt") { Get-Content "$shots\error.txt"; throw "Скриншоты: ошибка" }
          if ($p.ExitCode -ne 0) { throw "Скриншоты: код $($p.ExitCode)" }
          if ((Get-ChildItem $shots -Filter *.png).Count -lt 17) { throw "Скриншотов меньше семнадцати" }
      - name: Пробный режим — тестовое окно запускается
        # Копия GigaRest.exe под другим именем с --test-window должна показать окно с заголовком.
        shell: pwsh
        run: |
          Copy-Item out/GigaRest/GigaRest.exe "out/GigaRest/Тест 1 — закроется.exe"
          $p = Start-Process "out/GigaRest/Тест 1 — закроется.exe" -ArgumentList @('--test-window', '--mode', 'normal', '--title', '"Тест окно"') -PassThru
          $title = ""
          for ($i = 0; $i -lt 40 -and -not $title; $i++) { Start-Sleep -Milliseconds 250; $p.Refresh(); $title = $p.MainWindowTitle }
          Write-Host "Заголовок: '$title'"
          if ($title -ne "Тест окно") { if (-not $p.HasExited) { $p.Kill() }; throw "Тестовое окно не появилось" }
          if (-not $p.CloseMainWindow()) { throw "CloseMainWindow не сработал" }
          if (-not $p.WaitForExit(5000)) { $p.Kill(); throw "Тестовое окно не закрылось на крестик" }
          Remove-Item "out/GigaRest/Тест 1 — закроется.exe"
      - name: Самопроверка — настоящий переход в отдых на тестовых окнах
        # GigaRest.exe --selftest: тестовые окна → отдых → «Тихий» экран → снимок всего экрана → возврат.
        shell: pwsh
        run: |
          $data = "$env:RUNNER_TEMP\gigarest-selftest"
          $env:GIGAREST_DATA = $data
          $flag = "$data\rest-shown.flag"
          $p = Start-Process out/GigaRest/GigaRest.exe -ArgumentList '--selftest' -PassThru
          for ($i = 0; $i -lt 120 -and -not (Test-Path $flag) -and -not $p.HasExited; $i++) { Start-Sleep -Milliseconds 500 }
          Start-Sleep -Seconds 3
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory screenshots -Force | Out-Null
          $bmp.Save("$PWD\screenshots\13-samoproverka.png", [System.Drawing.Imaging.ImageFormat]::Png)
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Самопроверка не завершилась за 2 минуты" }
          Get-ChildItem "$data\logs" | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName }
          Copy-Item "$data\logs\*" screenshots -ErrorAction SilentlyContinue
          if (-not (Test-Path $flag)) { throw "Экраны отдыха не показались" }
          if ($p.ExitCode -ne 0) { throw "Самопроверка: код $($p.ExitCode)" }
      - name: Скриншоты — артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
      - name: Скриншоты в ветку screenshots
        # Картинки для README. Ветка без истории; каждая рабочая ветка — в своей папке.
        if: github.event_name != 'pull_request' && hashFiles('screenshots/*.png') != ''
        shell: pwsh
        run: |
          $branch = "$env:GITHUB_REF_NAME" -replace '[^A-Za-z0-9._-]', '-'
          $shots = "$env:GITHUB_WORKSPACE\screenshots"
          $ok = $false
          for ($attempt = 1; $attempt -le 6 -and -not $ok; $attempt++) {
            git fetch origin screenshots 2>$null
            $hasRemote = $LASTEXITCODE -eq 0
            $base = if ($hasRemote) { (git rev-parse FETCH_HEAD).Trim() } else { "" }
            $dir = "$env:RUNNER_TEMP\shots$attempt"
            git worktree add --detach $dir 2>$null
            Push-Location $dir
            git checkout --orphan "screenshots-tmp$attempt" --quiet
            git rm -rf . --quiet 2>$null
            if ($hasRemote) { git checkout FETCH_HEAD -- . 2>$null }
            if (Test-Path $branch) { Remove-Item $branch -Recurse -Force }
            New-Item -ItemType Directory $branch -Force | Out-Null
            Copy-Item "$shots\*.png" $branch -Force
            git add -A
            git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -m "Скриншоты: $env:GITHUB_REF_NAME $env:GITHUB_SHA" --quiet
            if ($hasRemote) { git push "--force-with-lease=screenshots:$base" origin HEAD:screenshots }
            else { git push origin HEAD:screenshots }
            $ok = $LASTEXITCODE -eq 0
            Pop-Location
            if (-not $ok) { Start-Sleep -Seconds (Get-Random -Minimum 3 -Maximum 12) }
          }
          if (-not $ok) { Write-Warning "Скриншоты не опубликованы" }
          $global:LASTEXITCODE = 0
      - name: Свежая сборка — выпуск dev-build (самообновление и постоянная ссылка)
        # Только если все проверки и самопроверка прошли (иначе сюда не дойдём). Программа читает version.json
        # и обновляется сама; Роман скачивает по одной ссылке:
        # https://github.com/Luchano55/gigarest/releases/download/dev-build/GigaRest-win-x64.zip
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $manifest = [ordered]@{
            build = [int]$env:GITHUB_RUN_NUMBER
            version = $env:GR_VERSION
            commit = $env:GITHUB_SHA
            zip = "GigaRest-win-x64.zip"
            sha256 = (Get-FileHash GigaRest-win-x64.zip -Algorithm SHA256).Hash
          }
          $manifest | ConvertTo-Json | Set-Content version.json -Encoding utf8NoBOM
          Get-Content version.json
          gh release delete dev-build --yes --cleanup-tag 2>$null
          $notes = "Свежая сборка GigaRest $env:GR_VERSION. Первый раз: скачайте GigaRest-win-x64.zip, распакуйте в обычную папку и запустите GigaRest.exe. " +
                   "Дальше программа обновляется сама (значок в трее → «Проверить обновления»)."
          gh release create dev-build GigaRest-win-x64.zip version.json --prerelease --target $env:GITHUB_SHA `
            --title "Свежая сборка $env:GR_VERSION" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create dev-build: код $LASTEXITCODE" }
          "Скачать: https://github.com/$env:GITHUB_REPOSITORY/releases/download/dev-build/GigaRest-win-x64.zip" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: GigaRest-win-x64
          path: out/GigaRest
          if-no-files-found: error
